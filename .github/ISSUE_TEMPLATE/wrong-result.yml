name: Wrong check result
description: A control says PASS, FAIL, NA or ERROR, and the Mac is not in that state.
labels: ["wrong-result"]
body:
  - type: markdown
    attributes:
      value: |
        An indicator that flags something harmless belongs here too. Security problems do not; see
        [SECURITY.md](https://github.com/b0dea/devward/blob/main/SECURITY.md).
        Never paste `results.json` as it is: it holds file and folder names from your Mac.
  - type: input
    id: control
    attributes:
      label: Control ID
      placeholder: BL-OS-01
    validations:
      required: true
  - type: input
    id: got
    attributes:
      label: Result you got
      placeholder: FAIL
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Result you expected
      placeholder: PASS
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        The control's evidence and note, and what shows the Mac's real state (the "Check it yourself" step of its
        lesson in teach/). Remove paths, usernames, hostnames and anything else that identifies you or your
        organisation.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        devward version (older copies: git describe --tags, in the devward folder):
        sw_vers -productVersion:
        uname -m:
        agent and its version (Claude Code, Codex, OpenCode):
        anything relevant that manages this Mac (device management, endpoint security):
    validations:
      required: true
