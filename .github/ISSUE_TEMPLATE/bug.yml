name: Bug report
description: fortkeep does something it should not, or fails to do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here; see [SECURITY.md](https://github.com/b0dea/fortkeep/blob/main/SECURITY.md).
        A check that gives the wrong result has its own form. One defect per issue.
        Never paste `results.json` as it is: it holds file and folder names from your Mac. Remove paths and usernames.
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The command, or what you asked the agent.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Pasted, not summarised, with paths and usernames removed.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        fortkeep version (older copies: git describe --tags, in the fortkeep folder):
        sw_vers -productVersion:
        uname -m:
        agent and its version (Claude Code, Codex, OpenCode):
    validations:
      required: true
