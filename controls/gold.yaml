# Gold: extras on top of the baseline. A gold item that repeats a baseline control
# isn't entered twice (see Plan 2a's Coverage table). Edit here, then `make controls`.
# urgent: true marks a control whose FAIL can mean the Mac is compromised now. The skills put it first and send the
# person to /if-red, /fix never offers a fix for it, and the weekly check sends its own notification. A FAIL whose
# evidence starts with not_urgent_if is a set-up step (no baseline yet, no sweep yet), not a sign of compromise.
- id: GD-SC-01
  title: Safe Chain age gate at 168 hours in every shell type
  layer: gold
  level: NICE
  check: checks/macos/GD-SC-01.sh
  fix: null
  fix_needs_admin: false
  risk: low
  alternatives: []
  teach: teach/GD-SC-01.md
  timeout: 90
