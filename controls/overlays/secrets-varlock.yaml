# Opt-in: secrets kept out of the agent's context with varlock. Agents read `.env.schema` (names, @sensitive),
# never the values, and run commands through `varlock run -- <cmd>`, which injects the values and masks them in the
# output. Values stay encrypted at rest (Secure Enclave / Touch ID) or in the Keychain. Limits: a script written to
# send a value somewhere still can; only a sandbox contains that. varlock itself must be trusted: installed from
# the official tap and pinned (OV-VL-01), telemetry off (OV-VL-02), its outbound network denied in the firewall
# (lesson OV-VL-02), and the agent guard refusing its secret-printing commands (OV-VL-03). Edit here, then `make build`.
# title and pick_if are what the set-up question shows for this overlay.
title: Secrets kept away from the agent with varlock
pick_if: you use varlock (or want to) so your coding agent can run commands that need passwords or API keys without ever seeing them.
controls:
- id: OV-VL-01
  title: varlock installed from its official tap and pinned
  layer: overlay:secrets-varlock
  level: MUST
  check: checks/macos/OV-VL-01.sh
  fix: null
  fix_needs_admin: false
  risk: low
  alternatives: []
  teach: teach/OV-VL-01.md
  timeout: 90
- id: OV-VL-02
  title: varlock's telemetry off
  layer: overlay:secrets-varlock
  level: SHOULD
  check: checks/macos/OV-VL-02.sh
  fix: null
  fix_needs_admin: false
  risk: low
  alternatives: []
  teach: teach/OV-VL-02.md
  timeout: 30
- id: OV-VL-03
  title: The agent guard refuses varlock's secret-printing commands
  layer: overlay:secrets-varlock
  level: MUST
  check: checks/macos/OV-VL-03.sh
  fix: null
  fix_needs_admin: false
  risk: low
  alternatives: []
  teach: teach/OV-VL-03.md
  timeout: 60
