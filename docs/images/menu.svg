<text x="28.4" y="48" class="c0" textLength="75.6" lengthAdjust="spacingAndGlyphs"> fortkeep</text>
<text x="20.0" y="86" class="c0 b" textLength="67.2" lengthAdjust="spacingAndGlyphs">fortkeep</text>
<text x="104.0" y="86" class="c90" textLength="260.4" lengthAdjust="spacingAndGlyphs">a security checkup for this Mac</text>
<text x="36.8" y="124" class="c90" textLength="75.6" lengthAdjust="spacingAndGlyphs">This copy</text>
<text x="146.0" y="124" class="c32" textLength="8.4" lengthAdjust="spacingAndGlyphs">✓</text>
<text x="154.4" y="124" class="c0" textLength="210.0" lengthAdjust="spacingAndGlyphs"> v0.1.0, a signed release</text>
