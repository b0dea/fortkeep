<text x="36.8" y="143" class="c90" textLength="84.0" lengthAdjust="spacingAndGlyphs">Last check</text>
<text x="120.8" y="143" class="c0" textLength="193.2" lengthAdjust="spacingAndGlyphs">   2026-11-20 07:48 UTC</text>
<text x="431.6" y="143" class="c0 b" textLength="92.4" lengthAdjust="spacingAndGlyphs">9 of 12 met</text>
<text x="532.4" y="143" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">·</text>
<text x="549.2" y="143" class="c31" textLength="67.2" lengthAdjust="spacingAndGlyphs">2 to fix</text>
<text x="624.8" y="143" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">·</text>
<text x="641.6" y="143" class="c36" textLength="84.0" lengthAdjust="spacingAndGlyphs">1 accepted</text>
<text x="36.8" y="162" class="c90" textLength="33.6" lengthAdjust="spacingAndGlyphs">Next</text>
<text x="70.4" y="162" class="c0" textLength="470.4" lengthAdjust="spacingAndGlyphs">         fortkeep agent, then type /fix (in Codex, $fix)</text>
<text x="20.0" y="200" class="c36 b" textLength="8.4" lengthAdjust="spacingAndGlyphs">➤</text>
<text x="28.4" y="200" class="c36 b" textLength="151.2" lengthAdjust="spacingAndGlyphs"> 1  Check this Mac</text>
<text x="305.6" y="200" class="c90" textLength="184.8" lengthAdjust="spacingAndGlyphs">every check, read-only</text>
<text x="20.0" y="219" class="c0" textLength="134.4" lengthAdjust="spacingAndGlyphs">  2  Scan a repo</text>
<text x="305.6" y="219" class="c90" textLength="210.0" lengthAdjust="spacingAndGlyphs">is a folder safe to open?</text>
<text x="20.0" y="238" class="c0" textLength="260.4" lengthAdjust="spacingAndGlyphs">  3  Fix with your coding agent</text>
<text x="305.6" y="238" class="c90" textLength="302.4" lengthAdjust="spacingAndGlyphs">start claude, codex or opencode here</text>
<text x="20.0" y="257" class="c0" textLength="159.6" lengthAdjust="spacingAndGlyphs">  4  Make a summary</text>
<text x="305.6" y="257" class="c90" textLength="142.8" lengthAdjust="spacingAndGlyphs">one you can share</text>
<text x="20.0" y="276" class="c0" textLength="92.4" lengthAdjust="spacingAndGlyphs">  5  Update</text>
<text x="305.6" y="276" class="c90" textLength="277.2" lengthAdjust="spacingAndGlyphs">move to the newest signed release</text>
<text x="20.0" y="295" class="c0" textLength="75.6" lengthAdjust="spacingAndGlyphs">  6  Quit</text>
<text x="20.0" y="333" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">↑</text>
<text x="28.4" y="333" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">↓</text>
<text x="36.8" y="333" class="c90" textLength="126.0" lengthAdjust="spacingAndGlyphs"> or j/k to move</text>
<text x="171.2" y="333" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">·</text>
<text x="179.6" y="333" class="c90" textLength="134.4" lengthAdjust="spacingAndGlyphs"> Enter to choose</text>
<text x="322.4" y="333" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">·</text>
<text x="330.8" y="333" class="c90" textLength="33.6" lengthAdjust="spacingAndGlyphs"> 1-6</text>
<text x="372.8" y="333" class="c90" textLength="8.4" lengthAdjust="spacingAndGlyphs">·</text>
<text x="381.2" y="333" class="c90" textLength="84.0" lengthAdjust="spacingAndGlyphs"> q to quit</text>
